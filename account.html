<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/home.css" />
  <link rel="stylesheet" href="src/css/pages.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__left">
        <button class="hamburger" type="button" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="brand">
          <div class="logo">
            <img src="./Public/Images/logo.png" alt="vortexboost logo" class="image img1">
          </div>
        </div>
      </div>
      <div class="topbar__right">
        <div class="balance">
          <a href="payment.html" class="lik" title="Add funds"><span class="balance__plus">+</span></a>
          <span class="balance__amt">0 XAF</span>
        </div>
        <button class="lang" type="button">EN <span class="caret">▼</span></button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- ACCOUNT DETAILS -->
    <div class="card">
      <div class="acctHead">
        <h2>Account Details</h2>
        <button class="signoutBtn" type="button" id="signoutBtn">SIGN OUT</button>
      </div>

      <div class="acctRow">
        <span class="k">Username:</span>
        <span class="v" id="acctUsername">—</span>
        <button class="editBtn" type="button" id="editUsernameBtn" title="Change username">✏️</button>
        <input class="control" id="newUsernameInput" type="text" style="display:none;width:200px" maxlength="30">
        <button class="btnGhost" type="button" id="saveUsernameBtn" style="display:none">Save</button>
      </div>

      <div class="acctRow">
        <span class="k">Email:</span>
        <span class="v" id="acctEmail">—</span>
        <span class="badge" id="emailBadge">Email Verified</span>
      </div>

      <div class="discountBox">
        Current Discount Applied: <b>None</b><br>
        Discount Uses Left: <b>0</b>
      </div>
    </div>

    <!-- COUNTRY -->
    <div class="card">
      <h2 class="cardTitle mt0">Current Country:</h2>
      <div class="countryRow">
        <span style="font-size:20px">🌐</span>
        <select id="countrySelect" aria-label="Country"></select>
      </div>
    </div>

    <!-- SECURITY -->
    <div class="card">
      <h2 class="cardTitle mt0">Security</h2>
      <div class="secInputs">
        <div class="password-field">
          <input class="control" id="curPass" type="password" placeholder="Current Password">
          <button class="toggle-pass" type="button" data-toggles="curPass" aria-label="Show password">👁</button>
        </div>
        <div class="password-field">
          <input class="control" id="newPass" type="password" placeholder="Password">
          <button class="toggle-pass" type="button" data-toggles="newPass" aria-label="Show password">👁</button>
        </div>
        <div class="password-field">
          <input class="control" id="confirmPass" type="password" placeholder="Confirm your password">
          <button class="toggle-pass" type="button" data-toggles="confirmPass" aria-label="Show password">👁</button>
        </div>
      </div>
      <p class="msg" id="secMsg"></p>
      <button class="btnPrimary" type="button" id="savePassBtn" style="margin-top:8px">Save</button>
    </div>

    <div class="guideFooter">
      Need help using the VortexBoost website?<br>
      Watch this video : <a href="support.html">Guide</a>
    </div>
  </main>

  <footer class="footerDark">© 2026 VortexBoost. All rights reserved.</footer>

  <script src="src/js/config.js"></script>
  <script src="src/js/app-shell.js"></script>
  <script src="src/js/account-page.js"></script>
</body>
</html>
